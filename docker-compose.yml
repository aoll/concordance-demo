services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: concordance
      POSTGRES_PASSWORD: concordance
      POSTGRES_DB: concordance
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concordance -d concordance"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
